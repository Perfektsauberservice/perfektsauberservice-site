<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Form-Registrierung (intern)</title>
</head>
<body>
<!--
  Netlify-Formularerkennung: statische, vollstaendige Feld-Definition fuer
  das sitewide "lead"-Formular. Nicht oeffentlich verlinkt, nicht in der
  Sitemap. Existiert ausschliesslich, damit Netlifys Build-Bot beim Scannen
  IMMER die vollstaendige, aktuelle Feldliste sieht -- unabhaengig davon, ob
  eine einzelne Seite bei einem inkrementellen Deploy erneut gescannt wird.
  Aenderung 2026-09-17: plz/ort/service/umfang/wunschtermin/email hinzugefuegt,
  nachdem diese fuenf Felder trotz korrektem Markup auf den echten Seiten
  nicht im gespeicherten Submission-Datensatz ankamen.
-->
<form name="lead" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="lead">
  <input type="hidden" name="seite" value="">
  <input type="hidden" name="lead_id" value="">
  <input type="hidden" name="gclid" value="">
  <input type="hidden" name="gbraid" value="">
  <input type="hidden" name="wbraid" value="">
  <input type="hidden" name="utm_source" value="">
  <input type="hidden" name="utm_medium" value="">
  <input type="hidden" name="utm_campaign" value="">
  <input type="hidden" name="utm_term" value="">
  <input type="hidden" name="utm_content" value="">
  <input type="hidden" name="landing_page_url" value="">
  <input type="hidden" name="first_seen_at" value="">
  <input name="bot-field">
  <input type="text" name="name">
  <input type="tel" name="telefon">
  <input type="text" name="plz">
  <input type="text" name="ort">
  <select name="service"><option value=""></option></select>
  <input type="text" name="umfang">
  <input type="text" name="wunschtermin">
  <input type="email" name="email">
  <textarea name="nachricht"></textarea>
  <input type="checkbox" name="agb_widerruf_accepted">
</form>
</body>
</html>
