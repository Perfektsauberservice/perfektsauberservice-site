name: SEO Daily Report

on:
  schedule:
    - cron: '30 5 * * *'  # 07:30 Germania (UTC+2)
  workflow_dispatch:        # rulare manuala pentru test

jobs:
  seo-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run SEO Daily Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          OPR_API_KEY: ${{ secrets.OPR_API_KEY }}
        run: node agent/scripts/seo-daily-report.mjs

      - name: Save state + snapshot
        run: |
          git config user.name "PSS SEO Bot"
          git config user.email "bot@perfektsauberservice.com"
          git add agent/state/seo-report-state.json agent/gsc-snapshots/
          if git diff --staged --quiet; then
            echo "No state/snapshot changes to commit."
          else
            git commit -m "seo-report: state + gsc snapshot actualizat [$(date +%Y-%m-%d)]"
            # Persist to the ref this run actually checked out -- never a
            # hard-coded branch name. `schedule` events only ever run off the
            # default branch, so github.ref_name resolves to "master" there;
            # workflow_dispatch resolves to whichever branch was selected when
            # launching the run. A genuine conflict here fails the step loudly
            # (no -f, no auto-resolve) rather than rebasing a feature branch
            # onto master or silently discarding either side.
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
