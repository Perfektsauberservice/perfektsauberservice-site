name: Keepalive

on:
  schedule:
    - cron: '0 6 * * *'  # zilnic la 06:00 UTC
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive commit
        run: |
          git config user.name "PSS Bot"
          git config user.email "bot@perfektsauberservice.com"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore: keepalive"
          git pull --rebase origin master
          git push
