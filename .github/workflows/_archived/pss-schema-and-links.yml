name: PSS Schema + Internal Links

on:
  workflow_dispatch:
  # PAUZAT 2026-04-29: oprit pana refacem paginile (modifica schema in paginile pe care le rescriem).
  # schedule:
  #   - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  inject-schema-and-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Agent 5 - Injecteaza Schema JSON-LD
        run: node agent/scripts/inject-schema.mjs

      - name: Agent 6 - Injecteaza Link-uri Interne
        run: node agent/scripts/inject-internal-links.mjs

      - name: Agent 4 - Regenereaza Sitemap
        run: node agent/scripts/update-sitemap.mjs

      - name: Commit and Push
        run: |
          git config user.name "PSS SEO Bot"
          git config user.email "bot@perfektsauberservice.com"
          git add -A
          git diff --staged --quiet || git commit -m "seo: schema JSON-LD + internal links [$(date +%Y-%m-%d)]"
          git pull --rebase origin master
          git push
