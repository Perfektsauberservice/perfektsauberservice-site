name: PSS Kleinanzeigen Monitor

on:
  schedule:
    # La fiecare 30 minute intre 06:00 si 21:59 ora DE (vara). UTC = DE - 2h in vara, -1h in iarna.
    # 04:00-20:59 UTC acopera ~06:00-21:59 DE vara si ~05:00-21:59 DE iarna.
    # Nota: GitHub Actions cron este best-effort; intervalul real poate varia (+5-15 min).
    - cron: '*/30 4-20 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Monitor Kleinanzeigen leads
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node agent/scripts/kleinanzeigen-monitor.mjs

      - name: Salveaza ID-urile vazute
        run: |
          git config user.name "PSS Bot"
          git config user.email "bot@perfektsauberservice.com"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > agent/config/kleinanzeigen-keepalive.txt
          git add agent/config/kleinanzeigen-seen.json agent/config/kleinanzeigen-keepalive.txt
          git diff --staged --quiet || git commit -m "chore: update kleinanzeigen seen log"
          git pull --rebase origin master
          git push
