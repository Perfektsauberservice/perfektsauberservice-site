name: PSS Rewrite Copy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: full-site | audit-only | single-file"
        required: true
        default: "full-site"
      dry_run:
        description: "true = report only, false = write changes"
        required: true
        default: "true"
      target_file:
        description: "Required only for single-file mode"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rewrite-copy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run copy rewrite bot
        env:
          REWRITE_MODE: ${{ github.event.inputs.mode }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TARGET_FILE: ${{ github.event.inputs.target_file }}
        run: python agent/scripts/rewrite_internal_copy.py

      - name: Show rewrite report
        run: cat agent/state/copy-rewrite-report.json

      - name: Commit rewrite changes
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name "Perfektsauberservice Bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore(copy): rewrite internal-sounding copy"
          git pull --rebase origin master
          git push
