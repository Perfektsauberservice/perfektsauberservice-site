name: PSS Background Auto-publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  autopublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run background auto-publish
        env:
          PSS_AUTOPUBLISH_TOKEN: ${{ secrets.PSS_AUTOPUBLISH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python agent/scripts/background_autopost.py
