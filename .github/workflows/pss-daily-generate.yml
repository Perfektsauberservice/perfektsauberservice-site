name: PSS Daily Generate

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  daily-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily article and queue it
        run: python agent/scripts/daily_generate.py

      - name: Commit generated queue changes
        run: |
          git config user.name "Perfektsauberservice Bot"
          git config user.email "bot@users.noreply.github.com"
          git add agent/state/topic-plan.json agent/state/autopost-queue.json agent/staging/
          git diff --cached --quiet || git commit -m "chore(auto): generate and queue daily article"
          git push
