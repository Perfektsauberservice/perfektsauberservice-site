name: PSS Facebook Auto-Poster

on:
  # Rulează la 30 minute după ce weekly-content publică articole
  schedule:
    - cron: '30 7,9,12,15,20 * * *'
  workflow_dispatch:

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post to Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: node agent/scripts/fb-poster.mjs

      - name: Commit posted log
        run: |
          git config user.name "PSS Bot"
          git config user.email "bot@perfektsauberservice.com"
          git add agent/config/fb-posted.json
          git diff --staged --quiet || git commit -m "chore: update fb-posted log"
          git push
