name: PSS GMB Reviews Update

# SUPERSEDED 2026-09-24: replaced by pss-gbp-reviews-sync.yml, which uses
# the official Google Business Profile APIs and writes data/google-reviews.json
# for js/gbp-reviews-widget.js, instead of patching review text into every
# HTML file via the Places API Legacy key. Kept for history, not deleted.
# Do not re-enable the schedule below -- pss-gbp-reviews-sync.yml is now the
# one active scheduled review-sync workflow.
on:
  # PAUZAT 2026-07-07: necesita Google Cloud Billing activ pe proiect, proprietarul a decis sa nu plateasca.
  # Actualizarea recenziilor se face manual, la cerere (vezi conversatie 2026-07-07).
  # schedule:
  #   - cron: '15 6 * * *'
  workflow_dispatch:        # ramane disponibil pentru rulare manuala daca se activeaza billing-ul

# Previne rulari suprapuse (ex. mai multe workflow_dispatch aproape simultane):
# o rulare noua asteapta sa se termine cea curenta in loc sa porneasca in paralel,
# eliminand riscul de commit-uri duplicate/race conditions intre rulari concurente.
concurrency:
  group: pss-gmb-reviews-update
  cancel-in-progress: false

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run GMB Reviews Update
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node agent/scripts/update-review-count.mjs

      - name: Commit changes
        run: |
          git config user.name "PSS GMB Bot"
          git config user.email "bot@perfektsauberservice.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: sync review count/rating from Google Business Profile [$(date +%Y-%m-%d)]"
          git pull --rebase origin master
          git push