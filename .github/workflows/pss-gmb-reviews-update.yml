name: PSS GMB Reviews Auto-Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch reviews + patch HTML files
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node agent/scripts/update-review-count.mjs

      - name: Check for new reviews + alert via Telegram (with AI draft)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node agent/scripts/check-new-reviews.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "PSS Reviews Bot"
          git config user.email "bot@perfektsauberservice.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "auto: update GMB review count + rating from Google Places API"
            git push
          else
            echo "No changes to commit."
          fi
