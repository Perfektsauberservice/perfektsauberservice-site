name: PSS Instagram Auto-Poster

on:
  schedule:
    - cron: '0 7,9,12,15,18 * * *'  # 09:00, 11:00, 14:00, 17:00, 20:00 Germania
  workflow_dispatch:

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node agent/scripts/ig-poster.mjs

      - name: Commit posted log
        run: |
          git config user.name "PSS Bot"
          git config user.email "bot@perfektsauberservice.com"
          git add agent/config/ig-posted.json
          git diff --staged --quiet || git commit -m "chore: update ig-posted log"
          git pull --rebase origin master
          git push
