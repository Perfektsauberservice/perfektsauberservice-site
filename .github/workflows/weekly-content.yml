name: Daily Content Pipeline

on:
  schedule:
    # 5 articole pe zi: 07:00, 09:00, 12:00, 15:00, 20:00 ora Germaniei (UTC+2 vara)
    - cron: '0 5 * * *'   # 07:00 Germania
    - cron: '0 7 * * *'   # 09:00 Germania
    - cron: '0 10 * * *'  # 12:00 Germania
    - cron: '0 13 * * *'  # 15:00 Germania
    - cron: '0 18 * * *'  # 20:00 Germania
  workflow_dispatch:
    inputs:
      topic:
        description: 'Subiect manual (optional)'
        required: false
      city:
        description: 'Oras (default: din queue)'
        required: false
      service:
        description: 'Serviciu (default: din queue)'
        required: false

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Content Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            node agent/scripts/pipeline.mjs \
              --topic "${{ github.event.inputs.topic }}" \
              --city "${{ github.event.inputs.city || 'Rastatt' }}" \
              --service "${{ github.event.inputs.service || 'Entrümpelung' }}"
          else
            node agent/scripts/pipeline.mjs
          fi

      - name: Update Sitemap (Agent 4)
        run: node agent/scripts/update-sitemap.mjs

      - name: Commit & Push new article
        run: |
          git config user.name "PSS Content Bot"
          git config user.email "bot@perfektsauberservice.com"
          git add blog/ images/blog/ sitemap.xml agent/config/article-topics.json content/auto/blog-index.json
          git diff --staged --quiet || git commit -m "content: neuer Artikel generiert [$(date +%Y-%m-%d)]"
          git pull --rebase origin master
          git push

      - name: Trigger FB Blog Poster (posteaza articolul nou pe Facebook)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pss-fb-blog-poster.yml',
              ref: 'master'
            });
            console.log('FB Blog Poster declansat!');
