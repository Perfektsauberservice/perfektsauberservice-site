name: PSS Copy Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run copy audit
        run: python agent/scripts/copy_audit.py

      - name: Commit audit report
        run: |
          git config user.name "Perfektsauberservice Bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f agent/state/copy-audit-report.json ]; then
            git add agent/state/copy-audit-report.json
            git diff --cached --quiet || git commit -m "chore(audit): update copy audit report"
            git pull --rebase origin master
            git push
          else
            echo "copy-audit-report.json not found, skipping commit"
          fi
