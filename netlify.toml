[build]
  publish = "."
  functions = "netlify/functions"
  command = "node generate-blog.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/telegram-bot"
  to = "/.netlify/functions/telegram-bot"
  status = 200

[[redirects]]
  from = "/api/pss-auto-content"
  to = "/.netlify/functions/pss-auto-content"
  status = 200

[[redirects]]
  from = "/dashboard/agent"
  to = "/dashboard/agent.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200
[[redirects]]
  from = "/service-page/fensterreinigung"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/book-online"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 200

[[redirects]]
  from = "/galerie"
  to = "/portfolio"
  status = 301
  force = true

[[redirects]]
  from = "/galerie.html"
  to = "/portfolio"
  status = 301
  force = true

