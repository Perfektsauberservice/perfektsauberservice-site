# === GLOBAL: .html -> pretty URL via Edge Function ===
# Netlify redirects engine nu permite splat capture + suffix stripping
# Vezi netlify/edge-functions/strip-html.js pentru implementare
[[edge_functions]]
  function = "strip-html"
  path = "/*"
