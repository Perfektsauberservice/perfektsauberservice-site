[build]
  publish = "."
  functions = "netlify/functions"
  command = "node generate-blog.js"
  # Skip build daca commit-ul modifica DOAR fisiere de stare (loguri auto-postare).
  # Exit 0 (skip) cand toate fisierele schimbate sunt sub agent/config/ sau agent/state/.
  # Reduce ~60-70% din deploys (chore: update fb/ig/kleinanzeigen logs + seo-report state nu schimba site-ul live).
  ignore = '[ -z "$(git diff --name-only HEAD^ HEAD | grep -vE ^agent/(config|state)/)" ]'

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    # Pages ship inline <script>/<style> per-file (no build-time nonce system), so
    # script-src/style-src keep 'unsafe-inline'. Real value here: blocks any
    # externally-sourced script/frame/connect from a domain not on this list (the
    # common XSS payload of injecting <script src="evil.tld">), locks down
    # object-src/base-uri/frame-ancestors. Domains verified empirically against
    # GTM/GA4, Google Ads conversion+call-tracking, and the Leaflet/ArcGIS map by
    # replaying real page loads through a local server with this policy attached.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google.com https://*.doubleclick.net www.gstatic.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://server.arcgisonline.com https://images.pexels.com https://*.google.com https://*.google.de https://*.doubleclick.net https://*.googletagmanager.com https://*.google-analytics.com https://*.googlesyndication.com; font-src 'self' data:; connect-src 'self' https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.google.com https://*.google.de https://*.doubleclick.net https://*.googleadservices.com https://*.googlesyndication.com; frame-src 'self' https://*.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Self-hosted fonts have hashed filenames (e.g. fraunces-K1ChjdfeQ_5Y.woff2),
# so they're safe to cache 1 year immutable. Filename change = cache bust.
[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# === Block direct access to internal automation/template paths ===
# Folders agent/, master/, outreach/ contain scripts, configs, and HTML templates
# that should never be served as public pages (DSGVO: avoid leaking template
# files with external Google Fonts CDN references etc.).
[[redirects]]
  from = "/agent/*"
  to = "/410.html"
  status = 404
  force = true
[[redirects]]
  from = "/master/*"
  to = "/410.html"
  status = 404
  force = true
[[redirects]]
  from = "/outreach/*"
  to = "/410.html"
  status = 404
  force = true

# === API functions (internal proxy) ===
[[redirects]]
  from = "/api/telegram-bot"
  to = "/.netlify/functions/telegram-bot"
  status = 200

[[redirects]]
  from = "/api/pss-auto-content"
  to = "/.netlify/functions/pss-auto-content"
  status = 200

# === Dashboard (internal, not SEO-indexed) ===
[[redirects]]
  from = "/dashboard/agent"
  to = "/dashboard/agent.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

